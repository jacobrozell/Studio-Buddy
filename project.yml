name: StudioBuddy
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
options:
  bundleIdPrefix: com.jacobrozell
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "7JT2JB89AV"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  StudioBuddy:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: GoogleService-Info.plist
        type: file
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
    resources:
      - path: Resources
        excludes:
          - "*.mp3"
          - "AppIconConcepts/**"
          - "README.md"
    postBuildScripts:
      - name: Firebase Crashlytics
        script: |
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(TARGET_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
      - name: Copy Demo Audio
        basedOnDependencyAnalysis: false
        script: |
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${dest}"
          find "${SRCROOT}/Resources" -maxdepth 1 \( -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.wav' \) -exec cp {} "${dest}/" \;
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Studio Buddy
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.mixstack
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: Info.plist

  StudioBuddyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: StudioBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.studiobuddy.tests
        GENERATE_INFOPLIST_FILE: YES

  StudioBuddyUISmokeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: StudioBuddyUITests/Support
      - path: StudioBuddyUITests/TabSmokeUITests.swift
        type: file
    dependencies:
      - target: StudioBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.studiobuddy.uitests.smoke
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StudioBuddy

  StudioBuddyUILandscapeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: StudioBuddyUITests/Support
      - path: StudioBuddyUITests/LandscapeSmokeUITests.swift
        type: file
    dependencies:
      - target: StudioBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.studiobuddy.uitests.landscape
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StudioBuddy

  StudioBuddyUIAccessibilityUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: StudioBuddyUITests/Support
      - path: StudioBuddyUITests/WCAGAccessibilityUITests.swift
        type: file
    dependencies:
      - target: StudioBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.studiobuddy.uitests.accessibility
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StudioBuddy

  StudioBuddyUIPadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: StudioBuddyUITests/Support
      - path: StudioBuddyUITests/IPadSplitUITests.swift
        type: file
    dependencies:
      - target: StudioBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.studiobuddy.uitests.ipad
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StudioBuddy

schemes:
  StudioBuddy:
    build:
      targets:
        StudioBuddy: all
    test:
      targets:
        - StudioBuddyTests
        - name: StudioBuddyUISmokeUITests
          parallelizable: true
        - name: StudioBuddyUILandscapeUITests
          parallelizable: true
        - name: StudioBuddyUIAccessibilityUITests
          parallelizable: true
        - name: StudioBuddyUIPadUITests
          parallelizable: true
      gatherCoverageData: true

  StudioBuddyCI:
    build:
      targets:
        StudioBuddy: all
    test:
      targets:
        - StudioBuddyTests
      gatherCoverageData: true

  StudioBuddyUISmoke:
    build:
      targets:
        StudioBuddy: all
    test:
      targets:
        - name: StudioBuddyUISmokeUITests
          parallelizable: true

  StudioBuddyUILandscape:
    build:
      targets:
        StudioBuddy: all
    test:
      targets:
        - name: StudioBuddyUILandscapeUITests
          parallelizable: true

  StudioBuddyUIAccessibility:
    build:
      targets:
        StudioBuddy: all
    test:
      targets:
        - name: StudioBuddyUIAccessibilityUITests
          parallelizable: true

  StudioBuddyUIPad:
    build:
      targets:
        StudioBuddy: all
    test:
      targets:
        - name: StudioBuddyUIPadUITests
          parallelizable: true

  StudioBuddyUI:
    build:
      targets:
        StudioBuddy: all
    test:
      targets:
        - name: StudioBuddyUISmokeUITests
          parallelizable: true
        - name: StudioBuddyUILandscapeUITests
          parallelizable: true
        - name: StudioBuddyUIAccessibilityUITests
          parallelizable: true
        - name: StudioBuddyUIPadUITests
          parallelizable: true
